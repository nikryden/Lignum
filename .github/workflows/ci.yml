name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lignum.sln

      - name: Build
        run: dotnet build Lignum.sln --configuration Release --no-restore

      - name: Test
        # Benchmarks and multi-GB tests are excluded from CI (Category=Manual).
        run: dotnet test Lignum.sln --configuration Release --no-build --filter "Category!=Manual"
