name: Publish

# Manual only: builds the self-contained single-file win-x64 exe and uploads it as an artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0). Leave empty for 0.1.<run number>."
        required: false
        default: ""

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "0.1.${{ github.run_number }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish src/Lignum.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          -p:SourceRevisionId=${{ github.sha }}
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Lignum-${{ steps.version.outputs.value }}-win-x64
          path: publish/Lignum.exe
          if-no-files-found: error
